# Runs the same gate as `just check`, which is what the repo treats as CI.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad xvfb
          openscad --version

      - uses: extractions/setup-just@v2

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the Arduino core and libraries
        run: |
          arduino-cli core update-index
          just firmware-deps

      # xvfb because some OpenSCAD builds still want a display to export from,
      # even headless.
      - name: just check
        run: xvfb-run -a just check
